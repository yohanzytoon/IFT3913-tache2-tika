# IFT3913 tâche 2 : exécute les tests de CharsetSupersets (originaux et corrigés)
# puis l'analyse de mutation PIT sur la classe étudiée.
name: tache2 CharsetSupersets tests et mutation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests-et-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build tika-core et ses dépendances
        run: mvn -B install -pl tika-core -am -DskipTests
      - name: Tests CharsetSupersetsTest et CharsetSupersetsDecodeAsTest
        run: mvn -B test -pl tika-core -Dtest=CharsetSupersetsTest,CharsetSupersetsDecodeAsTest
      - name: Analyse de mutation PIT (CharsetSupersets)
        run: mvn -B org.pitest:pitest-maven:1.30.0:mutationCoverage -pl tika-core
      - name: Rapport pitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-pitest
          path: tika-core/target/pit-reports
